# Local, production-like stack: PostgreSQL, a migration job, the API, two workers and the web app.
# Run: POSTGRES_PASSWORD=choose-one docker compose up --build
# Then seed once: docker compose run --rm api node dist/cli/seed.js
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: verdflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d verdflow"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., dockerfile: deploy/docker/api.Dockerfile }
    command: ["node", "dist/cli/migrate.js"]
    environment: &env
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/verdflow
      API_HOST: 0.0.0.0
      WEB_ORIGIN: http://localhost:8080
      DEV_KEYS_FILE: /tmp/dev-keys.json
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: deploy/docker/api.Dockerfile }
    environment: *env
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/ready"]
      interval: 10s

  worker:
    build: { context: ., dockerfile: deploy/docker/api.Dockerfile }
    command: ["node", "dist/worker.js"]
    environment: *env
    depends_on: { migrate: { condition: service_completed_successfully } }
    deploy: { replicas: 2 }

  web:
    build: { context: ., dockerfile: deploy/docker/web.Dockerfile }
    ports: ["8080:8080"]
    depends_on: [api]

volumes:
  db-data:
