# Starting point for a production cluster. Review with your platform team: image registry, secrets
# manager, ingress/TLS, network policies, PostgreSQL HA (not run in-cluster here) and residency rules.
apiVersion: v1
kind: Namespace
metadata: { name: verdflow }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: verdflow-config, namespace: verdflow }
data:
  API_HOST: "0.0.0.0"
  WEB_ORIGIN: "https://verdflow.example.org"
  COOKIE_SECURE: "true"
  PRESENCE_STALE_SECONDS: "60"
  WORKER_INTAKE_CONCURRENCY: "4"
  WORKER_DELIVERY_CONCURRENCY: "8"
---
# DATABASE_URL, METRICS_TOKEN and ANTHROPIC_API_KEY come from a Secret created by your secrets manager:
#   kubectl -n verdflow create secret generic verdflow-secrets --from-literal=DATABASE_URL=... ...
apiVersion: batch/v1
kind: Job
metadata: { name: verdflow-migrate, namespace: verdflow }
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true }
      containers:
        - name: migrate
          image: REGISTRY/verdflow-api:VERSION
          command: ["node", "dist/cli/migrate.js"]
          envFrom: [{ configMapRef: { name: verdflow-config } }, { secretRef: { name: verdflow-secrets } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: verdflow }
spec:
  replicas: 3
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: "/api/metrics", prometheus.io/port: "4000" }
    spec:
      securityContext: { runAsNonRoot: true }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app: api } } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: REGISTRY/verdflow-api:VERSION
          ports: [{ containerPort: 4000 }]
          envFrom: [{ configMapRef: { name: verdflow-config } }, { secretRef: { name: verdflow-secrets } }]
          readinessProbe: { httpGet: { path: /api/ready, port: 4000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: 4000 }, periodSeconds: 20 }
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: verdflow }
spec:
  selector: { app: api }
  ports: [{ port: 4000, targetPort: 4000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: verdflow }
spec:
  replicas: 2
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      securityContext: { runAsNonRoot: true }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app: worker } } }
      # The worker finishes its current message on SIGTERM; a send in flight is recovered as "uncertain".
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: REGISTRY/verdflow-api:VERSION
          command: ["node", "dist/worker.js"]
          envFrom: [{ configMapRef: { name: verdflow-config } }, { secretRef: { name: verdflow-secrets } }]
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { memory: 512Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: verdflow }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: REGISTRY/verdflow-web:VERSION
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: 8080 } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: verdflow }
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
---
# CPU is only a first signal. Scale workers on intake backlog age (vf_intake_oldest_backlog_seconds)
# through a metrics adapter once Prometheus is in place.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: worker, namespace: verdflow }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: worker }
  minReplicas: 2
  maxReplicas: 10
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: verdflow }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 3
  maxReplicas: 12
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api, namespace: verdflow }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: api } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: worker, namespace: verdflow }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: worker } }
